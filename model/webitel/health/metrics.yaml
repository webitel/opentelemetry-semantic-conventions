groups:
  - id: metric.webitel.health.ready
    type: metric
    metric_name: webitel.health.ready
    stability: development
    brief: Whether the node is ready to take traffic.
    note: >
      The value MUST be 1 while the node is in rotation, and 0 otherwise:
      before any check has passed, while a `liveness` or `critical` check
      fails, and while the node shuts down. A failing `informational` check
      MUST NOT set the value to 0.
    instrument: gauge
    unit: "{node}"

  - id: metric.webitel.health.check.state
    type: metric
    metric_name: webitel.health.check.state
    stability: development
    brief: Whether the health check currently passes.
    note: >
      The value MUST be 1 when the last result of the check is `ok`, and 0
      otherwise, including when the check has not run yet or its result is
      stale.
    instrument: gauge
    unit: "{check}"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required

  - id: metric.webitel.health.check.transitions
    type: metric
    metric_name: webitel.health.check.transitions
    stability: development
    brief: "Number of transitions of a health check into the status described by the `webitel.health.check.status` attribute."
    note: >
      The first completed run of a check MUST be counted as a transition. A
      result becoming stale MUST NOT be counted as a transition.
    instrument: counter
    unit: "{transition}"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required
      - ref: webitel.health.check.status
        requirement_level: required

  - id: metric.webitel.health.check.duration
    type: metric
    metric_name: webitel.health.check.duration
    stability: development
    brief: Duration of the last completed run of a health check.
    note: >
      This metric MUST NOT be reported before the first run of the check
      completes. A run in progress MUST NOT update the value.
    instrument: gauge
    unit: s
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required

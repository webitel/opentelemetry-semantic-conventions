groups:
  - id: metric.webitel.health.status
    type: metric
    metric_name: webitel.health.status
    stability: development
    brief: The current readiness status of the node.
    note: >
      A timeseries is produced for every possible value of
      `webitel.health.state`. The value of this metric is 1 for the current
      state of the node, and 0 for the other states.
    instrument: updowncounter
    unit: "1"
    attributes:
      - ref: webitel.health.state
        requirement_level: required

  - id: metric.webitel.health.check.status
    type: metric
    metric_name: webitel.health.check.status
    stability: development
    brief: The current status of the health check.
    note: >
      A timeseries is produced for every possible value of
      `webitel.health.check.state`. The value of this metric is 1 for the
      current state of the check, and 0 for the other states.
    instrument: updowncounter
    unit: "1"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required
      - ref: webitel.health.check.state
        requirement_level: required

  - id: metric.webitel.health.check.transitions
    type: metric
    metric_name: webitel.health.check.transitions
    stability: development
    brief: "Number of transitions of a health check into the state described by the `webitel.health.check.state` attribute."
    note: >
      The first completed run of a check MUST be counted as a transition. A
      result becoming stale MUST NOT be counted as a transition.
    instrument: counter
    unit: "{transition}"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required
      - ref: webitel.health.check.state
        requirement_level: required
        note: "`unknown` MUST NOT be reported."

  - id: metric.webitel.health.check.duration
    type: metric
    metric_name: webitel.health.check.duration
    stability: development
    brief: Duration of the last completed run of a health check.
    note: >
      This metric MUST NOT be reported before the first run of the check
      completes. A run in progress MUST NOT update the value.
    instrument: gauge
    unit: s
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required

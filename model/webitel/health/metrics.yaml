groups:
  - id: metric.webitel.health.ready
    type: metric
    metric_name: webitel.health.ready
    stability: development
    brief: Whether the node is taking traffic, as decided by its health checks.
    note: >
      1 while the node is in rotation, 0 while it is not: nothing has passed
      yet, a `liveness` or `critical` check is failing, or the node is shutting
      down. A degraded node — only `informational` checks failing — still
      reports 1.
    instrument: gauge
    unit: "{node}"

  - id: metric.webitel.health.check.state
    type: metric
    metric_name: webitel.health.check.state
    stability: development
    brief: Whether one health check is currently passing.
    note: >
      1 when the check's last result is `ok`, 0 otherwise. A check that never
      ran, or whose result went stale, reads as 0: an old answer is not a
      healthy one.
    instrument: gauge
    unit: "{check}"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required

  - id: metric.webitel.health.check.transitions
    type: metric
    metric_name: webitel.health.check.transitions
    stability: development
    brief: How many times a health check flipped into the given status since the process started.
    note: >
      A check starts out unknown, so its first completed run counts as one
      transition. Going stale does not: it is applied when the result is read,
      never stored. Use this to spot a flapping dependency that
      `webitel.health.check.state` shows as healthy right now.
    instrument: counter
    unit: "{transition}"
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required
      - ref: webitel.health.check.status
        requirement_level: required

  - id: metric.webitel.health.check.duration
    type: metric
    metric_name: webitel.health.check.duration
    stability: development
    brief: How long the health check's most recent completed run took.
    note: >
      Not reported until the check has completed its first run. A run that is
      still in flight does not update it, so a check that hangs shows its last
      good duration until it goes stale.
    instrument: gauge
    unit: s
    attributes:
      - ref: webitel.health.check.name
        requirement_level: required
      - ref: webitel.health.check.group
        requirement_level: required

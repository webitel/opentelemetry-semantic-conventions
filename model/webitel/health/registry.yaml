groups:
  - id: registry.webitel.health
    type: attribute_group
    display_name: Webitel Health Check Attributes
    brief: Attributes describing health checks of a node.
    attributes:
      - id: webitel.health.check.name
        type: string
        stability: development
        brief: The name of the health check.
        note: >
          A health check is a probe that the node runs in the background on its
          own schedule; its last result is cached. Reading a health check metric
          MUST NOT trigger a run of the check.
        examples: ["postgres", "rabbitmq", "consul"]

      - id: webitel.health.check.group
        type:
          members:
            - id: liveness
              value: "liveness"
              brief: The check tests whether the process is operational. A failure takes the node out of rotation and fails its liveness probe.
              stability: development
            - id: critical
              value: "critical"
              brief: The check tests a dependency local to the node. A failure takes the node out of rotation.
              stability: development
            - id: informational
              value: "informational"
              brief: The check tests a shared dependency. A failure marks the node degraded and leaves it in rotation.
              stability: development
        stability: development
        brief: The group of the health check, which determines how a failure of the check affects the readiness of the node.
        note: >
          The group is assigned when the check is registered. A check of shared
          infrastructure SHOULD NOT be assigned to `critical`.

      - id: webitel.health.check.state
        type:
          members:
            - id: ok
              value: "ok"
              brief: The check passes.
              stability: development
            - id: fail
              value: "fail"
              brief: The check fails.
              stability: development
            - id: unknown
              value: "unknown"
              brief: The check has not run yet, or its result is stale.
              stability: development
        stability: development
        brief: The state of the health check.
        note: >
          A check MUST move to `fail` only after several consecutive failures,
          and MUST move to `ok` on the first success.

      - id: webitel.health.state
        type:
          members:
            - id: ready
              value: "ready"
              brief: The node is in rotation and all its checks pass.
              stability: development
            - id: degraded
              value: "degraded"
              brief: The node is in rotation and at least one `informational` check fails.
              stability: development
            - id: not_ready
              value: "not_ready"
              brief: The node is out of rotation.
              stability: development
        stability: development
        brief: The readiness state of the node.
        note: >
          The node MUST be `not_ready` before any check has passed, while a
          `liveness` or `critical` check fails, and while the node shuts down.

groups:
  - id: registry.webitel.kb
    type: attribute_group
    display_name: Webitel Knowledge Base Attributes
    brief: Attributes describing knowledge base articles and rerank calls.
    attributes:
      - id: webitel.kb.article.index.state
        type:
          members:
            - id: pending
              value: "pending"
              brief: The latest version waits to be indexed.
              stability: development
            - id: indexing
              value: "indexing"
              brief: The latest version is being indexed.
              stability: development
            - id: indexed
              value: "indexed"
              brief: The latest version is searchable.
              stability: development
            - id: failed
              value: "failed"
              brief: The latest version could not be indexed.
              stability: development
        stability: development
        brief: How far the latest version of an article got through indexing.

      - id: webitel.kb.rerank.provider
        type: string
        stability: development
        brief: The provider that served the rerank call.
        examples: ["cohere", "bge-reranker"]

      - id: webitel.kb.rerank.model
        type: string
        stability: development
        brief: The model the rerank call was made to, as the provider names it.
        examples: ["rerank-v3.5", "bge-reranker-v2-m3"]

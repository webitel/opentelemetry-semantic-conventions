groups:
  - id: metric.webitel.kb.article.index.count
    type: metric
    metric_name: webitel.kb.article.index.count
    stability: development
    brief: "Number of article indexes that are currently in the state described by the `webitel.kb.article.index.state` attribute."
    note: >
      Each live article has one index, in the state of its latest version.
      This metric MUST be reported by a single node.
    instrument: updowncounter
    unit: "{article}"
    attributes:
      - ref: webitel.kb.article.index.state
        requirement_level: required

  - id: metric.webitel.kb.rerank.duration
    type: metric
    metric_name: webitel.kb.rerank.duration
    stability: development
    brief: Duration of rerank calls to a provider.
    instrument: histogram
    unit: s
    attributes:
      - ref: webitel.kb.rerank.provider
        requirement_level: required
      - ref: webitel.kb.rerank.model
        requirement_level: required
      - ref: error.type
        requirement_level:
          conditionally_required: If the call failed.

  - id: metric.webitel.kb.article.index.duration
    type: metric
    metric_name: webitel.kb.article.index.duration
    stability: development
    brief: "Duration from an article edit to the new version of the article becoming searchable."
    note: >
      This metric MUST be recorded once per version that becomes searchable,
      and MUST NOT be recorded for a job that makes no version searchable.
      A negative duration, caused by a clock skew between hosts, MUST be
      recorded as 0.
    instrument: histogram
    unit: s
    attributes:
      - ref: webitel.kb.article.index.embedded
        requirement_level: required

  - id: metric.webitel.kb.article.index.job.count
    type: metric
    metric_name: webitel.kb.article.index.job.count
    stability: development
    brief: "Number of indexing jobs that are currently waiting in the broker in the state described by the `webitel.kb.article.index.state` attribute."
    note: >
      A `pending` job waits in the `kb.reindex` queue, a `failed` job in the
      `kb.reindex.dlq` queue. A job that is being processed MUST NOT be
      counted. This metric MUST NOT be reported while the broker is
      unreachable.
    instrument: gauge
    unit: "{job}"
    attributes:
      - ref: webitel.kb.article.index.state
        requirement_level: required
        note: Only `pending` and `failed` apply.

  - id: metric.webitel.kb.article.index.job.failed
    type: metric
    metric_name: webitel.kb.article.index.job.failed
    stability: development
    brief: "Number of indexing jobs sent to the dead letter queue."
    note: >
      A job MUST be counted once, when it is sent to the dead letter queue.
      Failed attempts that are retried MUST NOT be counted.
    instrument: counter
    unit: "{job}"
    attributes:
      - ref: error.type
        requirement_level: required
        note: >
          One of: `envelope` — the message is not a valid indexing job;
          `permanent` — a retry cannot fix the failure; `exhausted` — the
          retries ran out; `unexpected` — any other failure.

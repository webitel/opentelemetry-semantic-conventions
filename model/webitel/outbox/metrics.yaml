groups:
  - id: metric.webitel.outbox.event.count
    type: metric
    metric_name: webitel.outbox.event.count
    stability: development
    brief: Number of outbox events waiting to be published to the broker.
    note: This metric MUST be reported only by the node that runs the relay.
    instrument: updowncounter
    unit: "{event}"

  - id: metric.webitel.outbox.event.age
    type: metric
    metric_name: webitel.outbox.event.age
    stability: development
    brief: Age of the oldest outbox event waiting to be published to the broker.
    note: >
      The value MUST be 0 when no event is waiting. This metric MUST be
      reported only by the node that runs the relay.
    instrument: gauge
    unit: s

  - id: metric.webitel.outbox.relay.leader
    type: metric
    metric_name: webitel.outbox.relay.leader
    stability: development
    brief: Whether the node runs the outbox relay.
    note: >
      The value MUST be 1 on the node that holds the relay lock, and 0 on the
      other nodes.
    instrument: gauge
    unit: "{node}"

  - id: metric.webitel.outbox.relay.poisoned
    type: metric
    metric_name: webitel.outbox.relay.poisoned
    stability: development
    brief: Number of outbox events moved to the poison queue after the relay ran out of retries.
    note: >
      An event MUST be counted once, when it is moved to the poison queue. An
      event in the poison queue is never published.
    instrument: counter
    unit: "{event}"
